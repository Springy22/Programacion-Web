<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UFT-8">
        <meta name="viewprt" content="width=device-width, initial-scale=1.0">
        <title>Formulario con Bootstrap</title>
        <!--Bootstrap CSS-->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
        <div class="container mt-5">
            <h2 class="mb-4 text-center">Registro de Usuario</h2>
            <form class="p-4 shadow rounded bg-white">
                <!--Datos personales-->
                <div class="mb-3">
                    <label for="nombre" class="form-label">Nombre completo</label>
                    <input type="text" class="form-control" id="nombre" placeholder="Ej: Juan Pérez">
                </div>
                <div class="mb-3">
                    <label for="correo" class="form-label">Correo electrónico</label>
                    <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com">
                </div>
                <div class="mb-3">
                    <label for="telefono" class="form-label">Teléfono</label>
                    <input type="tel" class="form-control" id="telefono" placeholder="(###) ###-####">
                </div>
                <!--Datos de acceso-->
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label for="usuario" class="form-labell">Usuario</label>
                        <input type="text" class="form-control" id="usuario" placeholder="Usuario123">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label for="password" class="form-label">Contraseña</label>
                        <input type="password" class="form-control" id="password">
                    </div>
                </div>
                <!--Preferencias-->
                <div class="mb-3">
                    <label for="carrera" class="form-label">Carrera</label>
                    <select class="form-select" id="carrera">
                        <option selected disabled>Selecciona una opción</option>
                        <option>Ingeniería en Sistemas</option>
                        <option>Ingeniería Industrial</option>
                        <option>Ingeniería Civil</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Turno</label><br>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="turno" id="matutino" value="matutino">
                        <label class="form-check-label" for="matutino">Matutino</label>
                    </div>
                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="turno" id="vespertino" value="vespertino">
                        <label class="form-check-label" for="vespertino">Vespertino</label>
                    </div>
                </div>
                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" id="terminos">
                    <label class="form-check-label" for="terminos">Acepto los términos y condiciones</label>
                </div>
                <!--Botón-->
                <div class="d-grid">
                    <button type="submit" class="btn btn-primary">Registrarse</button>
                </div>
            </form>
        </div>
    </body>
</html>
