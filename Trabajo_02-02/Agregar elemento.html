<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <title>Agregar Elemento</title>
        <style>
            .cuadro{
                width: 100px;
                height: 100px;
                background-color: red;
            }

            .cuadro-grande{
                width: 200px;
                height: 200px;
                background-color: blue;
            }
        </style>
    </head>
    <body>
        <h1 id="titulo">¡Hola, Mundo!</h1>
        <button id="cambiar">Cambiar Titulo</button>
        <br>
        <ul id="lista">
            <li>Elemento1</li>
            <li>Elemento2</li>
            <li>Elemento3</li>
            <li>Elemento4</li>
        </ul>
        <button id="agregar">Agregar Elemento</button>
        <button id="eliminar">Eliminar Ultimo Elemento</button>
        <br>
        <input type="text" id="inputElemento" placeholder="Escriba el elemento:">
        <button id="eliminarEspecifico">Eliminar Elemento</button>

        <br>
        <br>
        <div id="cuadro" class="cuadro"></div>
        <br>
        <button id="cambiarEstilo">Cambiar Estilo</button>
        <br>
        <br>
        <input type="text" id="inputTexto" placeholder="Escribe algo...">
        <p id="resultado"></p>
        <br>

        <script>
            document.getElementById('cambiar').onclick = function(){
                if(document.getElementById('titulo').textContent == '¡Hola, JavaScript!')
                    document.getElementById('titulo').textContent = '¡Hola, Mundo!';
                else
                    document.getElementById('titulo').textContent = '¡Hola, JavaScript!';
            };

            document.getElementById('agregar').onclick = function(){
                let nuevoElemento = document.createElement('li');
                let pos = document.getElementById('lista').children.length+1;
                nuevoElemento.textContent = "Elemento"+pos;
                document.getElementById('lista').appendChild(nuevoElemento);
            };

            document.getElementById('eliminar').onclick = function(){
                const lista = document.getElementById('lista');
                if (lista.lastChild){
                    lista.removeChild(lista.lastElementChild);
                }
            };

            document.getElementById('cuadro').onclick = function(){
                const cuadro = document.getElementById('cuadro');

                cuadro.classList.toggle('cuadro-grande');
                /*
                if(cuadro.classList.contains ('cuadro')){
                    cuadro.classList.remove ('cuadro');
                    cuadro.classList.add ('cuadro-grande');
                }
                else{
                    cuadro.classList.remove ('cuadro-grande');
                    cuadro.classList.add ('cuadro');
                }
                */
            };

            document.getElementById('inputTexto').addEventListener('input', function(event){
                document.getElementById('resultado').textContent=event.target.value;
            });

            document.getElementById('eliminarEspecifico').onclick = function(){
                const textoBuscado = document.getElementById('inputElemento').value.trim();
                const listaTemp = document.getElementById('lista');
                const elementos = lista.getElementByTagName('li');


                for(let i = elementos.length - 1; i >= 0; i--){
                    if (elementos[i].textContent == textoBuscado){
                        lista.removeChild(elementos[i]);
                    }
                }
            };
        </script>
    </body>
</html>
